name: {{package_name}}
description: Shared bootstrap package for core DI and Firebase setup.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  get_it: ^8.0.0
  flutter_bloc: ^8.1.6
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  package_info_plus: ^8.1.2
  flutter_secure_storage: ^10.3.1
  
  authentication:
    path: ../../features/authentication
  core_package:
    path: ../../core
  design_system:
    path: ../../../packages/design_system
  app_router:
    path: ../../../packages/app_router

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
