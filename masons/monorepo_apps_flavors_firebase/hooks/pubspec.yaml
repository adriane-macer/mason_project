name: enterprise_monorepo_brick_hooks
description: Automated CLI Wizard hooks for the enterprise monorepo brick.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Gives your hooks access to HookContext, context.logger, and context.vars
  mason: ^0.1.0-g.10

  # Powerfully handles multi-select arrays, single picks, and terminal confirms
  interact: ^2.1.1